name: Loxone Weather Service CI/CD

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

permissions:
  contents: read

jobs:
  tests:
    name: tests (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest

    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    strategy:
      fail-fast: false
      matrix:
        php: ['8.4', '8.5']
        include:
          # 8.4 runs on the default file storage, 8.5 on Redis: both backends are covered.
          - php: '8.4'
            redis_url: ''
          - php: '8.5'
            coverage: true
            redis_url: 'redis://localhost:6379'

    steps:
      - uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, intl
          coverage: ${{ matrix.coverage && 'pcov' || 'none' }}
          tools: composer:v2

      - name: Get composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache Composer packages
        uses: actions/cache@v6
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-php${{ matrix.php }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-php${{ matrix.php }}-composer-

      - name: Validate composer.json and composer.lock
        run: composer validate --strict

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Security audit
        run: composer audit --locked

      - name: Lint yaml
        run: ./bin/console lint:yaml config --parse-tags

      - name: Lint container
        run: ./bin/console lint:container

      - name: Run phpunit
        if: ${{ !matrix.coverage }}
        env:
          REDIS_URL: ${{ matrix.redis_url }}
        run: vendor/bin/phpunit

      - name: Run phpunit with coverage (minimum 95% lines)
        if: ${{ matrix.coverage }}
        env:
          REDIS_URL: ${{ matrix.redis_url }}
        run: |
          vendor/bin/phpunit --coverage-text=coverage.txt --colors=never
          cat coverage.txt
          lines=$(grep -m1 -E '^\s*Lines:' coverage.txt | grep -oE '[0-9]+\.[0-9]+' | head -1)
          echo "Line coverage: ${lines}%"
          awk -v l="$lines" 'BEGIN { exit (l + 0 >= 95) ? 0 : 1 }'

  quality:
    name: code quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Lint GitHub workflows (actionlint)
        # An invalid workflow is skipped by GitHub without a failing check; catch it here.
        run: docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.12 -color

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          coverage: none
          tools: composer:v2

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Coding standard (PHP-CS-Fixer)
        run: composer cs

      - name: Rector (no pending refactorings)
        run: composer rector

      - name: Static analysis (PHPStan, level max + baseline)
        run: composer phpstan

  # Single, stable status check for branch protection: matrix entries come and go
  # (PHP versions), this name does not.
  ci:
    if: always()
    needs: [ tests, quality ]
    runs-on: ubuntu-latest
    steps:
      - name: All jobs passed
        run: |
          test "${{ needs.tests.result }}" = "success"
          test "${{ needs.quality.result }}" = "success"
