name: Loxone Weather Service CI/CD

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

env:
  SYMFONY_DEPRECATIONS_HELPER: max[direct]=0

jobs:
  symfony:

    runs-on: ubuntu-latest

    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    strategy:
      fail-fast: false
      matrix:
        php-versions: ['8.1', '8.2', '8.3']

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-versions }}
          extensions: mbstring, intl
          coverage: ${{ matrix.php-versions == '8.3' && 'pcov' || 'none' }}
          tools: composer:v2

      - name: Get composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-php${{ matrix.php-versions }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-php${{ matrix.php-versions }}-composer-

      - name: Validate composer.json and composer.lock
        run: composer validate

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Run phpstan
        run: composer phpstan

      - name: Lint yaml
        run: ./bin/console lint:yaml config --parse-tags

      - name: Lint container
        run: ./bin/console lint:container

      - name: Security audit
        # Non-blocking until the Symfony 6.0 -> 6.4 LTS upgrade lands (6.0 is EOL and has open advisories).
        continue-on-error: true
        run: composer audit --locked

      - name: Run phpunit
        env:
          REDIS_URL: "redis://localhost:6379"
        run: |
          if [ "${{ matrix.php-versions }}" = "8.3" ]; then
            php bin/phpunit --coverage-text --colors=never
          else
            php bin/phpunit
          fi

      - name: Smoke test front controller (prod)
        env:
          REDIS_URL: "redis://localhost:6379"
        run: tests/smoke.sh prod

      - name: Smoke test front controller (dev)
        # Known failure: symfony/runtime 6.0 calls ini_set('assert.warning') which PHP 8.3 deprecates,
        # and debug mode prints it into the response body. Becomes blocking with the Symfony 6.4 upgrade.
        continue-on-error: true
        env:
          REDIS_URL: "redis://localhost:6379"
        run: tests/smoke.sh dev
