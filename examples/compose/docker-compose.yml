services:
  nginx:
    image: nginx
    depends_on:
      - php
    ports:
      - "6066:80"
    volumes:
      - ./symfony.conf:/etc/nginx/conf.d/symfony.conf:ro

  php:
    image: jimmycleuren/loxone-weather-service
    environment:
      # One of the two keys is enough. With both set, Weatherbit is used unless
      # WEATHER_PROVIDER says otherwise (auto | weatherbit | openweathermap).
      - WEATHERBIT_KEY=<weatherbit-key>
      # - OPENWEATHERMAP_KEY=<openweathermap-key>
      # - WEATHER_PROVIDER=openweathermap
      # Optional: store in Redis instead of the data volume below.
      # - REDIS_URL=redis://redis:6379
    volumes:
      # locations and forecasts (when REDIS_URL is not set)
      - data:/app/var/data

volumes:
  data:
