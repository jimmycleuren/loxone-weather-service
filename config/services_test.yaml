services:
  _defaults:
    autowire: true
    autoconfigure: true

  App\Tests\Doubles\:
    resource: '../tests/Doubles'

  App\Tests\Doubles\WeatherProvider\Weatherbit:
    arguments: ['%env(WEATHERBIT_KEY)%']

  # Tests never call the real Weatherbit API. Replacing only this service keeps
  # the rest of the wiring (store, provider choice, keys) identical to prod.
  App\WeatherProvider\Weatherbit:
    alias: App\Tests\Doubles\WeatherProvider\Weatherbit
