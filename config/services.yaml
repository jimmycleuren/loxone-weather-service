# Configuration is read from environment variables (see .env and README).
parameters:
    # Defaults, so an unset variable means "not configured" instead of a
    # container error (#368).
    env(WEATHER_PROVIDER): 'auto'
    env(WEATHERBIT_KEY): ''
    env(OPENWEATHERMAP_KEY): ''
    env(REDIS_URL): ''
    env(LAT): ''
    env(LON): ''
    env(ASL): ''

services:
    _defaults:
        autowire: true
        autoconfigure: true
        bind:
            Psr\Cache\CacheItemPoolInterface $store: '@app.store'

    App\:
        resource: '../src/'
        exclude:
            - '../src/Kernel.php'
            - '../src/WeatherProvider/WeatherSource.php'

    # Locations and forecasts. Files in var/data unless REDIS_URL is set.
    app.store:
        class: Psr\Cache\CacheItemPoolInterface
        factory: ['App\Storage\StoreFactory', 'create']
        arguments:
            - '%env(REDIS_URL)%'
            - '%kernel.project_dir%/var/data'

    App\WeatherProvider\Weatherbit:
        arguments: ['%env(WEATHERBIT_KEY)%']

    App\WeatherProvider\OpenWeatherMap:
        arguments: ['%env(OPENWEATHERMAP_KEY)%']

    App\WeatherProvider\WeatherProvider:
        arguments:
            $source: '%env(WEATHER_PROVIDER)%'
            $weatherbitKey: '%env(WEATHERBIT_KEY)%'
            $openWeatherMapKey: '%env(OPENWEATHERMAP_KEY)%'

    App\LocationProvider\LocationProvider:
        arguments:
            $defaultLocation: ['%env(LAT)%', '%env(LON)%', '%env(ASL)%']
