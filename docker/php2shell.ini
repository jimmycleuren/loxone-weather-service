; Defense in depth for PHP2Shell (CVE-2026-109618 / CVE-2026-109619).
; The real fix is PHP >= 8.3.36 (see Dockerfile); these settings only shrink the attack surface.
; This service only handles small GET requests from the Miniserver: no uploads, no sessions.
session.upload_progress.enabled = 0
post_max_size = 1M
upload_max_filesize = 1M
file_uploads = Off
