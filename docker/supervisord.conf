[supervisord]
nodaemon=true

[program:php]
command = docker-php-entrypoint php-fpm
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; Refresh the forecast every 30 minutes. Runs under supervisord instead of cron so it
; inherits the container environment (API keys, REDIS_URL); cron jobs do not.
[program:update-weather]
command = php /app/bin/console app:update-weather --every=1800
autorestart = true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
